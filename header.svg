<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">
  <defs>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="18%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="82%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#70a5fd" stop-opacity="0"/>
      <stop offset="50%" stop-color="#70a5fd" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#70a5fd" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="900" height="240"/></clipPath>
    <style>
      .reel { animation: roll 1.6s linear infinite; }
      @keyframes roll { from { transform: translateX(0); } to { transform: translateX(-45px); } }

      .flick { animation: flicker 4.5s steps(1) infinite; }
      @keyframes flicker {
        0%,96% { opacity: 1; } 96.5% { opacity: .82; } 97% { opacity: 1; }
        97.5% { opacity: .9; } 98% { opacity: 1; }
      }

      .name { opacity: 0; animation: fadeUp 1.1s ease-out .2s forwards; }
      .sub  { opacity: 0; animation: fadeUp 1.1s ease-out .8s forwards; }
      .rule { transform-origin: 450px 0; transform: scaleX(0); animation: grow 1s ease-out .55s forwards; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes grow { to { transform: scaleX(1); } }

      .beam { animation: pan 7s ease-in-out infinite; }
      @keyframes pan { 0% { transform: translateX(-60%); } 50% { transform: translateX(60%); } 100% { transform: translateX(-60%); } }

    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="240" fill="#0d1117"/>

    <!-- projector beam -->
    <rect class="beam" x="0" y="34" width="900" height="172" fill="url(#sweep)"/>

    <g class="flick">
      <!-- perforation bars -->
      <rect x="0" y="0" width="900" height="34" fill="#1a1b27"/>
      <rect x="0" y="206" width="900" height="34" fill="#1a1b27"/>
      <g class="reel">
      <rect x="-90" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="-45" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="0" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="45" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="90" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="135" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="180" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="225" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="270" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="315" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="360" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="405" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="450" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="495" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="540" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="585" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="630" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="675" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="720" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="765" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="810" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="855" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="900" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="945" y="8.5" width="24" height="17" rx="4" fill="#0d1117"/>
      </g>
      <g class="reel">
      <rect x="-90" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="-45" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="0" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="45" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="90" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="135" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="180" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="225" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="270" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="315" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="360" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="405" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="450" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="495" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="540" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="585" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="630" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="675" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="720" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="765" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="810" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="855" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="900" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      <rect x="945" y="214.5" width="24" height="17" rx="4" fill="#0d1117"/>
      </g>
      <line x1="0" y1="34" x2="900" y2="34" stroke="#70a5fd" stroke-opacity=".35" stroke-width="1"/>
      <line x1="0" y1="206" x2="900" y2="206" stroke="#70a5fd" stroke-opacity=".35" stroke-width="1"/>

      <!-- title card -->
      <text class="name" x="450" y="111" text-anchor="middle" fill="#c9d1d9" font-size="44" letter-spacing="9">ARNAV PODICHETTY</text>
      <rect class="rule" x="330" y="129" width="240" height="2" fill="#70a5fd"/>
      <text class="sub" x="450" y="165" text-anchor="middle" fill="#70a5fd" font-size="15" letter-spacing="5">DATA · MACHINE LEARNING · SOFTWARE</text>

      <!-- slate marks -->
      <text x="26" y="198" fill="#6e7681" font-size="11" letter-spacing="2">REEL 01</text>
      <text x="874" y="198" text-anchor="end" fill="#6e7681" font-size="11" letter-spacing="2">24 FPS</text>
    </g>

    <rect width="900" height="240" fill="url(#vignette)"/>
  </g>
</svg>
